[package]
license.workspace = true
repository.workspace = true
name = "memory-models"
version.workspace = true
edition.workspace = true
description = "Local embedding (bge-m3) and reranking (bge-reranker) models for the Memory memory daemon"

[features]
default = []
# Optional native CPU BLAS for local macOS validation. Portable CPU inference remains the default.
accelerate = ["candle-core/accelerate"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = "0.22.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
safetensors = "0.8"
tracing = "0.1"

[[bin]]
name = "memory-models-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "memory-models-convert"
path = "src/bin/convert.rs"
