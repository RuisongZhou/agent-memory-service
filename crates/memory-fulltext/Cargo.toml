[package]
license.workspace = true
repository.workspace = true
name = "memory-fulltext"
version.workspace = true
edition.workspace = true
description = "Tantivy full-text index with jieba/regex analyzer and entity alias dictionary for the Memory memory daemon"

[dependencies]
anyhow = "1"
# zstd / stemmer / stopword features are not needed (custom analyzer, lz4 doc store)
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
jieba-rs = "0.11"
aho-corasick = "1.1"
regex = "1.11"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
