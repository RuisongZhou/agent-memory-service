[package]
name = "memory-algo-memos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MemOS algorithm: short-term turn buffers with asynchronous long-term formation and hybrid retrieval"
publish = false

[features]
# Self-tests for `agent-memoryd selftest`; disable to leave them out of the build.
selftest = []

[dependencies]
memory-config = { path = "../memory-config" }
memory-domain = { path = "../memory-domain" }
memory-engine = { path = "../memory-engine" }
memory-fulltext = { path = "../memory-fulltext" }
memory-rules = { path = "../memory-rules" }
memory-store = { path = "../memory-store" }
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
