[package]
name = "memory-algo-mem0"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mem0 algorithm: ordered additive formation with semantic retrieval"
publish = false

[dependencies]
memory-config = { path = "../memory-config" }
memory-domain = { path = "../memory-domain" }
memory-engine = { path = "../memory-engine" }
memory-rules = { path = "../memory-rules" }
memory-store = { path = "../memory-store" }
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
