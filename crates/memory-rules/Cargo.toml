[package]
name = "memory-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure temporal, identifier and memory revision planning rules"

[dependencies]
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[dev-dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
