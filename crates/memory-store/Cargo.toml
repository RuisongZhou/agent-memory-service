[package]
name = "memory-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SurrealDB persistence for the memory service: transactions, schema, repositories and integrity glue"
publish = false

[dependencies]
memory-domain = { path = "../memory-domain" }
memory-rules = { path = "../memory-rules" }
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "3.0", default-features = false, features = ["kv-surrealkv", "rustls"] }
tokio = { version = "1", features = ["full"] }
