[package]
name = "memory-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local shared memory service with evidence, revisions, HTTP and MCP"
publish = false

[features]
default = ["selftest"]
# Self-tests behind `agent-memoryd selftest`; disable for a daemon without diagnostics.
selftest = []

[dependencies]
memory-algo-mem0 = { path = "../memory-algo-mem0" }
memory-config = { path = "../memory-config" }
memory-domain = { path = "../memory-domain" }
memory-engine = { path = "../memory-engine" }
memory-rules = { path = "../memory-rules" }
memory-store = { path = "../memory-store" }
anyhow = "1"
axum = "0.8"
blake3 = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
mimalloc = "0.1.48"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.2.0", features = ["server", "client", "transport-io", "macros"] }
# Dialogue outbox and recall record.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Codex keeps older session rollouts zstd-compressed (`import plan --include sessions`).
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agent-memoryd"
path = "src/bin/agent_memoryd.rs"
