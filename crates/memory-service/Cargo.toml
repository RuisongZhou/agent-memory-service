[package]
name = "memory-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local shared memory service with evidence, revisions, HTTP and MCP"
publish = false

[features]
default = ["selftest"]
# Self-tests behind `agent-memoryd selftest`; disable for a daemon without diagnostics.
selftest = []

[dependencies]
memory-config = { path = "../memory-config" }
memory-domain = { path = "../memory-domain" }
memory-fulltext = { path = "../memory-fulltext" }
memory-rules = { path = "../memory-rules" }
memory-store = { path = "../memory-store" }
anyhow = "1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
lru = "0.16.2"
mimalloc = "0.1.48"
regex = "1.12.3"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.2.0", features = ["server", "client", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
surrealdb = { version = "3.0", default-features = false, features = ["kv-surrealkv", "rustls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "agent-memoryd"
path = "src/bin/agent_memoryd.rs"
